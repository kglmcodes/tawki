<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tawki</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Tawki</div>
  <select id="lang" aria-label="Language"></select>
</header>

<main id="app">
  <section id="view-browse" class="view">
    <div class="toolbar">
      <input id="search" type="search" inputmode="search" placeholder="Search word, pinyin, meaning">
      <button id="hide-known" class="chip" aria-pressed="false">Hide known</button>
    </div>
    <p id="browse-meta" class="meta"></p>
    <ul id="vocab-list" class="cards"></ul>
  </section>

  <section id="view-study" class="view" hidden>
    <div class="toolbar">
      <button id="study-scope" class="chip" aria-pressed="true">Unseen only</button>
      <button id="study-shuffle" class="chip">Shuffle</button>
    </div>
    <p id="study-count" class="meta"></p>
    <div id="card" class="flashcard">
      <div class="face front">
        <span id="card-word" class="card-word"></span>
        <span class="hint">tap to reveal</span>
      </div>
      <div class="face back" hidden>
        <div id="card-pinyin" class="card-pinyin"></div>
        <div id="card-meaning" class="card-meaning"></div>
        <div id="card-example" class="card-example"></div>
      </div>
    </div>
    <div id="study-actions" class="study-actions">
      <button id="btn-again" class="btn ghost">Again</button>
      <button id="btn-know" class="btn primary">Know</button>
    </div>
    <p id="study-done" class="meta" hidden>Deck complete. Shuffle or switch to Unseen only to keep going.</p>
  </section>

  <section id="view-patterns" class="view" hidden>
    <ul id="pattern-list" class="cards"></ul>
  </section>

  <section id="view-progress" class="view" hidden>
    <div id="progress"></div>
    <button id="reset" class="btn ghost danger">Reset progress</button>
  </section>
</main>

<nav class="tabbar" role="tablist">
  <button class="tab is-active" data-tab="browse">Browse</button>
  <button class="tab" data-tab="study">Study</button>
  <button class="tab" data-tab="patterns">Patterns</button>
  <button class="tab" data-tab="progress">Progress</button>
</nav>

<script src="app.js"></script>
</body>
</html>
