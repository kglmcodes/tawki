<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tawki</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true">
      <g fill="currentColor">
        <rect x="5.5"  y="24" width="5" height="16" rx="2.5"/>
        <rect x="13.5" y="16" width="5" height="32" rx="2.5"/>
        <rect x="21.5" y="21" width="5" height="22" rx="2.5"/>
        <rect x="29.5" y="10" width="5" height="44" rx="2.5"/>
        <rect x="37.5" y="19" width="5" height="26" rx="2.5"/>
        <rect x="45.5" y="14" width="5" height="36" rx="2.5"/>
        <rect x="53.5" y="25" width="5" height="14" rx="2.5"/>
      </g>
    </svg>
    <span>Tawki</span>
  </div>
  <div class="topbar-controls">
    <select id="notation" aria-label="Notation">
      <option value="both">注音 + Pinyin</option>
      <option value="zhuyin">Zhuyin</option>
      <option value="pinyin">Pinyin</option>
    </select>
    <select id="lang" aria-label="Language"></select>
  </div>
</header>

<main id="app">
  <!-- LEARN -->
  <section id="view-learn" class="view">
    <div class="segmented" role="tablist" aria-label="Theory">
      <button class="seg is-active" data-learn="vocab" role="tab">Vocabulary</button>
      <button class="seg" data-learn="zhuyin" role="tab">Zhuyin</button>
      <button class="seg" data-learn="patterns" role="tab">Patterns</button>
    </div>

    <div id="learn-vocab">
      <div class="toolbar">
        <input id="search" type="search" inputmode="search" placeholder="Search word, pinyin, meaning">
        <button id="hide-known" class="chip" aria-pressed="false">Hide known</button>
      </div>
      <div id="lesson-grid" class="lesson-grid"></div>
      <ul id="vocab-list" class="cards" hidden></ul>
      <p id="browse-meta" class="meta"></p>
    </div>

    <div id="learn-zhuyin" hidden>
      <div id="zhuyin-ref"></div>
    </div>

    <div id="learn-patterns" hidden>
      <ul id="pattern-list" class="cards"></ul>
    </div>
  </section>

  <!-- PRACTICE -->
  <section id="view-practice" class="view" hidden>
    <div class="toolbar">
      <select id="scope" aria-label="Scope"></select>
      <select id="mode" aria-label="Mode">
        <option value="recognition">Recognize</option>
        <option value="production">Produce</option>
        <option value="quiz">Quiz</option>
      </select>
      <button id="study-shuffle" class="chip" title="Shuffle">Shuffle</button>
    </div>
    <p id="study-count" class="meta"></p>

    <div id="card" class="flashcard">
      <div class="face front">
        <div class="speakbar" id="front-speak"></div>
        <span id="front-main" class="card-word"></span>
        <span id="front-zhuyin" class="card-zhuyin zhuyin"></span>
        <span id="front-sub" class="card-pinyin pinyin"></span>
        <span class="hint" id="front-hint">tap to reveal</span>
      </div>
      <div class="face back" hidden>
        <div id="back-word" class="card-word"></div>
        <div id="back-zhuyin" class="card-zhuyin zhuyin"></div>
        <div id="back-pinyin" class="card-pinyin pinyin"></div>
        <div id="back-meaning" class="card-meaning"></div>
        <div id="back-example" class="card-example"></div>
        <div class="speakbar" id="back-speak"></div>
      </div>
    </div>

    <div id="quiz-options" class="quiz" hidden></div>

    <div id="study-actions" class="study-actions">
      <button class="btn ghost g-again" data-grade="again">Again</button>
      <button class="btn ghost g-hard" data-grade="hard">Hard</button>
      <button class="btn primary g-good" data-grade="good">Good</button>
      <button class="btn ghost g-easy" data-grade="easy">Easy</button>
    </div>
    <button id="next-btn" class="btn primary wide" hidden>Next</button>

    <p id="study-done" class="meta" hidden>Deck complete for this scope.</p>
  </section>

  <!-- PROGRESS -->
  <section id="view-progress" class="view" hidden>
    <div id="progress"></div>
    <button id="export-progress" class="btn ghost wide">Export progress</button>
    <label class="btn ghost wide" for="import-file">Import progress</label>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <button id="reset" class="btn ghost danger wide">Reset progress</button>
  </section>
</main>

<nav class="tabbar" role="tablist">
  <button class="tab is-active" data-tab="learn">Learn</button>
  <button class="tab" data-tab="practice">Practice</button>
  <button class="tab" data-tab="progress">Progress</button>
</nav>

<script src="app.js"></script>
</body>
</html>
